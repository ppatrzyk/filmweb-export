[project]
name = "filmweb"
version = "0.12"
description = "Export movie ratings from filmweb.pl"
authors = [ {name = "Piotr Patrzyk"}, ]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["filmweb", "movie", "crawler", "data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
]
dependencies = [
    "docopt>=0.6.2,<1",
    "requests>=2.34.2,<3",
    "tqdm>=4.70.1,<5",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.22.3,<7",
    "ruff>=0.17.1,<1",
]

[project.urls]
Source = "https://github.com/ppatrzyk/filmweb-export"

[project.scripts]
filmweb = "filmweb.main:main"

[build-system]
requires = ["setuptools", ]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["filmweb"]

[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
